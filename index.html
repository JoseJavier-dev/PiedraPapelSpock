<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>No queria hacer este proyecto</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>


    <div class="container">


        <div class="game">

            <h1 class="colorizable">Piedra Papel Tijeras Lagarto Spock</h1>


            <div class="buttons">
                <button onclick="hacerSonido('piedra'); jugar('piedra')">🪨</button>
                <button onclick="hacerSonido('papel'); jugar('papel')">📄</button>
                <button onclick="hacerSonido('tijeras'); jugar('tijeras')">✂️</button>
                <button onclick="hacerSonido('lagarto'); jugar('lagarto')">🦎</button>
                <button onclick="hacerSonido('spock'); jugar('spock')">🖖</button>

            </div>

            <p class="colorizable" id="resultado"></p>
            <p class="colorizable">Jugador: <span id="scoreJugador">0</span></p>
            <p class="colorizable">IA: <span id="scoreIA">0</span></p>
            <button id="info-btn">Información del juego</button>


        </div>
        <!-- menu configuracion -->
        <div class="sidebar">
            <h2>Configuración</h2>
            <div class="config-section">
                <p>Dificultad de la ia:</p>
                <select id="difficulty"   >
                    <option value="0">Elegir proyecto en vez de examen</option>
                    <option value="1" selected>Facil</option>
                    <option value="2">Medio</option>
                    <option value="3">Dificil</option>
                </select>
            </div>


            <div class="config-section">
                <label>
                    <input type="checkbox" id="music-toggle"> Música
                </label>
            </div>

            <div class="config-section">
                <label>
                    <input type="checkbox" id="sound-toggle" checked> Sonido
                </label>
            </div>
            <div class="config-section">
                <label for="volume-slider">Volumen:</label>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
            </div>
            <div class="config-section">
                <label for="win-limit">Victorias para ganar:</label>
                <input type="number" id="win-limit" value="5" min="1" max="50">
            </div>
            <div class="config-section">
                <label>
                    <input type="checkbox" id="two-players-toggle"> Modo 2 jugadores IRL
                </label>
            </div>

            <div id="multiplayer-ui" style="display: none;">

                <div class="config-section">
                    <input type="text" id="player1-name" value="Jugador 1">
                    <button onclick="sumarPunto(1)">+1</button>
                </div>

                <div class="config-section">
                    <input type="text" id="player2-name" value="Jugador 2">
                    <button onclick="sumarPunto(2)">+1</button>
                </div>

            </div>
            <div class="config-section">
                <label>Color del texto:</label>
                <input type="color" id="text-color-picker" value="#ffffff">
            </div>

            <div class="config-section">
                <label>Color de fondo:</label>
                <input type="color" id="bg-color-picker" value="#1e1e2f">
            </div>

        </div>
    </div>
    <div id="info-modal" class="modal hidden">
        <div class="modal-content">
            <img src="res/reglas.jpg" alt="Reglas del juego">
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
